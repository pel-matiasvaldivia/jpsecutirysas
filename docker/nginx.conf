server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # --- Compresión ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/ld+json;

    # --- Chequeo de salud (usado por el HEALTHCHECK del contenedor) ---
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # El HTML se revalida siempre, así un deploy se ve de inmediato
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Imágenes y fuentes: cacheo largo
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
    }

    # CSS y JS: cacheo moderado
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # --- Compresión ---
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/ld+json;

    # --- Chequeo de salud (usado por el HEALTHCHECK del contenedor) ---
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # El HTML se revalida siempre, así un deploy se ve de inmediato
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Imágenes y fuentes: cacheo largo
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf)$ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
    }

    # CSS y JS: se revalidan siempre. Sin esto, un navegador con la hoja de
    # estilos vieja en caché la mezcla con el HTML nuevo (el HTML no se cachea)
    # y la página se ve rota hasta que vence el plazo.
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Formulario de contacto: lo atiende el contenedor `api` del stack.
    # El upstream va en una variable a propósito: así nginx arranca aunque
    # el servicio api todavía no esté levantado (devuelve 502 hasta que lo esté).
    location /api/ {
        resolver 127.0.0.11 valid=10s;   # DNS interno de Docker
        set $upstream_api http://api:8080;

        proxy_pass $upstream_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        client_max_body_size 32k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}

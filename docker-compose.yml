# Stack de desarrollo: construye la imagen desde el código local.
#   docker compose up -d --build   →  http://localhost:8080
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/pel-matiasvaldivia/jpsecutirysas:local
    container_name: jpsecurity-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

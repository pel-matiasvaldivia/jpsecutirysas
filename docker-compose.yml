# Stack de JP Security SAS.
# Toma la imagen publicada por GitHub Actions en el registry del repositorio
# (GitHub Container Registry), no la construye localmente.
#
#   docker compose pull
#   docker compose up -d
#
# Variables (opcionales, se pueden poner en un archivo .env al lado):
#   IMAGE      imagen completa a correr. Por defecto, la última de la rama principal.
#   HTTP_PORT  puerto publicado en el host. Por defecto 80.
services:
  web:
    image: ${IMAGE:-ghcr.io/pel-matiasvaldivia/jpsecutirysas:latest}
    container_name: jpsecurity-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

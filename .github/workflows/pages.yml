name: Deploy to GitHub Pages

# Publica el sitio estático en GitHub Pages desde la rama por defecto.
# Requiere: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html styles.css script.js _site/
          cp -r assets _site/assets
          # Evita que Pages procese el contenido con Jekyll
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

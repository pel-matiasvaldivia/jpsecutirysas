name: Build and publish containers

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build, test and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Imágenes locales para el test de integración, antes de publicar nada
      - name: Build web image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jpsecurity-web:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build api image for testing
        uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          tags: jpsecurity-api:test
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Levantar el stack
        env:
          IMAGE_WEB: jpsecurity-web:test
          IMAGE_API: jpsecurity-api:test
          HTTP_PORT: '8080'
        run: |
          set -euo pipefail
          docker compose up -d

          for servicio in jpsecurity-web jpsecurity-api; do
            estado=starting
            for i in $(seq 1 30); do
              estado=$(docker inspect -f '{{.State.Health.Status}}' "$servicio" 2>/dev/null || echo starting)
              [ "$estado" = "healthy" ] && break
              sleep 2
            done
            if [ "$estado" != "healthy" ]; then
              echo "$servicio no quedó saludable (estado: $estado)"
              docker compose logs
              exit 1
            fi
          done

      - name: Probar el sitio
        run: |
          set -euo pipefail
          base=http://localhost:8080

          curl -fsS "$base/healthz" > /dev/null
          curl -fsS "$base/" | grep -q "JP SECURITY SAS"
          curl -fsS -o /dev/null "$base/styles.css"
          curl -fsS -o /dev/null "$base/script.js"
          curl -fsS -o /dev/null "$base/assets/logo.png"

          # Las cabeceras de seguridad deben llegar también en las rutas
          # que definen su propio Cache-Control.
          for ruta in / /styles.css /assets/logo.png; do
            curl -fsSI "${base}${ruta}" | grep -qi "x-content-type-options: nosniff" \
              || { echo "Falta X-Content-Type-Options en ${ruta}"; exit 1; }
          done

          # El HTML servido tiene que traer la versión sellada, no el marcador
          if curl -fsS "$base/" | grep -q "__ASSET_VERSION__"; then
            echo "El HTML quedó con el marcador de versión sin reemplazar"
            exit 1
          fi

          version=$(curl -fsS "$base/" | sed -n 's/.*script\.js?v=\([a-f0-9]\{10\}\).*/\1/p' | head -1)
          if [ -z "$version" ]; then
            echo "No se encontró la versión de los assets en el HTML"
            exit 1
          fi
          curl -fsS -o /dev/null "$base/styles.css?v=$version"
          curl -fsS -o /dev/null "$base/script.js?v=$version"
          echo "Versión de assets: $version"

          # El envío del formulario no debe abrir WhatsApp: el único modo de
          # llegar a WhatsApp es hacer clic en un enlace.
          if curl -fsS "$base/script.js" | grep -q "window.open"; then
            echo "script.js abre ventanas por su cuenta"
            exit 1
          fi

          # CSS y JS se revalidan siempre
          curl -fsSI "$base/script.js" | grep -qi "cache-control: no-cache" \
            || { echo "script.js no se está sirviendo con no-cache"; exit 1; }

          echo "Sitio OK"

      - name: Probar el formulario de contacto
        run: |
          set -euo pipefail
          base=http://localhost:8080

          # La api se alcanza a través del proxy de nginx, como en producción
          curl -fsS "$base/api/healthz" | grep -q '"ok": true'

          # Consulta válida
          respuesta=$(curl -fsS -X POST "$base/api/contacto" \
            -H 'Content-Type: application/json' \
            -d '{"nombre":"Juan Pérez","telefono":"261 555 1234","email":"juan@mail.com","servicio":"Seguridad física","mensaje":"Prueba automática"}')
          echo "$respuesta" | grep -q '"ok": true' \
            || { echo "La consulta válida no fue aceptada: $respuesta"; exit 1; }

          # Tiene que haber quedado guardada en el volumen
          docker compose exec -T api cat /data/consultas.jsonl | grep -q "Juan Pérez" \
            || { echo "La consulta no se guardó en disco"; exit 1; }

          # Falta el teléfono -> 400
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$base/api/contacto" \
            -H 'Content-Type: application/json' -d '{"nombre":"Ana"}')
          [ "$codigo" = "400" ] || { echo "Se esperaba 400 y llegó $codigo"; exit 1; }

          # Envío de bot (campo que el formulario real no manda) -> se descarta
          curl -fsS -X POST "$base/api/contacto" -H 'Content-Type: application/json' \
            -d '{"nombre":"Bot","telefono":"2615551234","sitio_web":"http://spam"}' > /dev/null
          if docker compose exec -T api cat /data/consultas.jsonl | grep -q '"nombre": "Bot"'; then
            echo "No se filtró el envío de bot"
            exit 1
          fi

          echo "Formulario OK"

      - name: Apagar el stack
        if: always()
        run: docker compose down -v || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata del sitio
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publicar el sitio
        id: push_web
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Metadata de la api
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publicar la api
        id: push_api
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Imágenes publicadas"
            echo ""
            echo "**Sitio**"
            echo '```'
            echo "${{ steps.meta_web.outputs.tags }}"
            echo "digest: ${{ steps.push_web.outputs.digest }}"
            echo '```'
            echo "**API de contacto**"
            echo '```'
            echo "${{ steps.meta_api.outputs.tags }}"
            echo "digest: ${{ steps.push_api.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

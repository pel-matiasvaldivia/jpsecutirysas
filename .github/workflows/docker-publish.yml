name: Build and deploy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Construye la imagen, la prueba levantándola y la publica en GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build, test and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      deploy: ${{ steps.vps.outputs.configured }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Imagen local para el smoke test, antes de publicar nada
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jpsecurity:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name jpsec-test -p 8080:80 jpsecurity:test

          for i in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' jpsec-test)" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          status=$(docker inspect -f '{{.State.Health.Status}}' jpsec-test)
          if [ "$status" != "healthy" ]; then
            echo "El contenedor no quedó saludable (estado: $status)"
            docker logs jpsec-test
            exit 1
          fi

          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "JP SECURITY SAS"
          curl -fsS -o /dev/null http://localhost:8080/styles.css
          curl -fsS -o /dev/null http://localhost:8080/script.js
          curl -fsS -o /dev/null http://localhost:8080/assets/logo.png

          # Las cabeceras de seguridad deben llegar también en las rutas
          # que definen su propio Cache-Control.
          for path in / /styles.css /assets/logo.png; do
            curl -fsSI "http://localhost:8080${path}" | grep -qi "x-content-type-options: nosniff" \
              || { echo "Falta X-Content-Type-Options en ${path}"; exit 1; }
          done

          echo "Smoke test OK"

      - name: Clean up test container
        if: always()
        run: docker rm -f jpsec-test || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El contexto `secrets` no se puede usar en el `if` de un job,
      # así que publicamos la decisión como output.
      - name: ¿Hay VPS configurado?
        id: vps
        if: github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$VPS_HOST" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No hay secret VPS_HOST cargado; se omite el deploy."
          fi

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 2. Levanta el stack en el VPS con la imagen recién publicada
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy al VPS
    needs: build
    if: |
      needs.build.outputs.deploy == 'true' &&
      (github.ref_name == github.event.repository.default_branch ||
       startsWith(github.ref, 'refs/tags/v') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    env:
      # Se despliega por digest: el VPS corre exactamente lo que se testeó acá.
      IMAGE: ${{ needs.build.outputs.digest != '' && format('ghcr.io/{0}@{1}', github.repository, needs.build.outputs.digest) || format('ghcr.io/{0}:latest', github.repository) }}
      REMOTE_DIR: ${{ vars.VPS_PATH || '/opt/jpsecurity' }}
      HTTP_PORT: ${{ vars.HTTP_PORT || '80' }}
      SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar clave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Sin secret VPS_KNOWN_HOSTS: se confía en la clave que presente el servidor."
            ssh-keyscan -p "$SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Copiar el compose al servidor
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$REMOTE_DIR'"
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" docker-compose.prod.yml \
            "$VPS_USER@$VPS_HOST:$REMOTE_DIR/docker-compose.yml"

      - name: Levantar el stack
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" \
            IMAGE="$IMAGE" HTTP_PORT="$HTTP_PORT" REMOTE_DIR="$REMOTE_DIR" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DIR"

          # .env para que un `docker compose up -d` manual use la misma imagen
          printf 'IMAGE=%s\nHTTP_PORT=%s\n' "$IMAGE" "$HTTP_PORT" > .env

          docker compose pull
          docker compose up -d --remove-orphans

          # Esperar a que el healthcheck dé verde
          estado=starting
          for i in $(seq 1 30); do
            estado=$(docker inspect -f '{{.State.Health.Status}}' jpsecurity-web 2>/dev/null || echo starting)
            [ "$estado" = "healthy" ] && break
            sleep 2
          done

          if [ "$estado" != "healthy" ]; then
            echo "El contenedor no quedó saludable (estado: $estado)"
            docker compose logs --tail 50
            exit 1
          fi

          # Verificación extra desde el propio servidor, si hay con qué
          if command -v curl > /dev/null 2>&1; then
            curl -fsS "http://127.0.0.1:${HTTP_PORT}/healthz" > /dev/null
            curl -fsS "http://127.0.0.1:${HTTP_PORT}/" | grep -q "JP SECURITY SAS"
          elif command -v wget > /dev/null 2>&1; then
            wget -qO- "http://127.0.0.1:${HTTP_PORT}/healthz" > /dev/null
            wget -qO- "http://127.0.0.1:${HTTP_PORT}/" | grep -q "JP SECURITY SAS"
          else
            echo "Aviso: no hay curl ni wget en el VPS; queda el healthcheck del contenedor."
          fi

          # Limpia solo imágenes viejas de este proyecto, no las de otros stacks
          docker image prune -f --filter "label=org.opencontainers.image.title=JP Security SAS" || true

          echo "Deploy OK: $IMAGE"
          REMOTE

      - name: Summary
        run: |
          {
            echo "### Deploy al VPS"
            echo ""
            echo "- Imagen: \`$IMAGE\`"
            echo "- Directorio: \`$REMOTE_DIR\`"
            echo "- Puerto: \`$HTTP_PORT\`"
          } >> "$GITHUB_STEP_SUMMARY"

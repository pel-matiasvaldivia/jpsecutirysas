name: Build and publish container

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build, test and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Imagen local para el smoke test, antes de publicar nada
      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jpsecurity:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name jpsec-test -p 8080:80 jpsecurity:test

          for i in $(seq 1 20); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' jpsec-test)" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          status=$(docker inspect -f '{{.State.Health.Status}}' jpsec-test)
          if [ "$status" != "healthy" ]; then
            echo "El contenedor no quedó saludable (estado: $status)"
            docker logs jpsec-test
            exit 1
          fi

          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "JP SECURITY SAS"
          curl -fsS -o /dev/null http://localhost:8080/styles.css
          curl -fsS -o /dev/null http://localhost:8080/script.js
          curl -fsS -o /dev/null http://localhost:8080/assets/logo.png

          # Las cabeceras de seguridad deben llegar también en las rutas
          # que definen su propio Cache-Control.
          for path in / /styles.css /assets/logo.png; do
            curl -fsSI "http://localhost:8080${path}" | grep -qi "x-content-type-options: nosniff" \
              || { echo "Falta X-Content-Type-Options en ${path}"; exit 1; }
          done

          echo "Smoke test OK"

      - name: Clean up test container
        if: always()
        run: docker rm -f jpsec-test || true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Imagen publicada"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
